apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: asynqmon-v2
  name: asynqmon-v2
  namespace: asynqmon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asynqmon-v2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: asynqmon-v2
    spec:
      containers:
      - args:
        - --redis-addr=redis.redis:6379
        - --redis-db=15
        image: ghcr.io/klikit/shadowchef/core:asynqmon-dev
        imagePullPolicy: Always
        name: asynqmon-v2
        ports:
        - containerPort: 8080
          protocol: TCP
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: regsecret
